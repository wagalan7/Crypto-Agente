# Suíte do Agente Consultório. Escopo deliberadamente restrito a este produto:
# o bot de cripto, que divide o repositório, tem os próprios testes em
# backend/tests/pg_integration_*.py e NÃO deve ser coletado por esta suíte.
[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
